    to: employee.user05@velmora.example
    subject: Email and Calendar Tips
    body: 'Email and calendar tips


      Email and calendar are the backbone of how Velmora teams coordinate. These tips cover storage limits, attachments, shared
      mailboxes, and a few habits that save time for everyone.


      ## Mailbox storage

      Each mailbox holds up to 100 GB. You will receive a warning as you approach the limit. To free space, empty the deleted
      items folder, remove large attachments you have already saved elsewhere, and archive old project folders. Mail is never
      deleted automatically to make room.


      ## Attachments

      The largest attachment you can send or receive is 25 MB. For larger files, share a link to the file in your shared drive
      instead. Links are better anyway: recipients always see the current version, and you can remove access later.


      Never email restricted information, such as customer data or credentials, as an attachment. Use the approved sharing
      methods described in the data classification policy.


      ## Shared mailboxes

      Teams such as the Helpdesk, payroll, and recruiting use shared mailboxes. Ask the mailbox owner to add you; access is
      granted through a Helpdesk ticket that the owner approves. Shared mailboxes do not have passwords.


      ## Calendar habits

      - Set your working hours so colleagues in other offices can find good meeting times.

      - Add an agenda to every meeting invitation.

      - Use the meeting room booking tool to reserve rooms; do not add rooms to invitations by typing their names.

      - Decline meetings you cannot attend so organizers can plan.

      - When you are out of office, set an automatic reply and block the time on your calendar.


      ## External email

      Messages from outside the company show an "External" banner. Be careful with external messages that ask you to sign
      in, open an attachment, or change payment details. If something feels wrong, use the Report Phish button described on
      the reporting phishing page.


      ## Mail on your phone

      You can read company mail on a personal phone after enrolling it in mobile device management. See the mobile devices
      and BYOD page for the steps. Enrolled phones can be wiped remotely if they are lost.


      ## Mailing lists

      Company-wide distribution lists are moderated. If you need to send a message to everyone in an office or the whole company,
      ask Internal Communications. Team lists can be requested through the Helpdesk.


      ## Signatures

      Use the standard signature template from the brand page: your name, title, and office. Do not add images or quotes,
      which can trigger spam filters at other companies.'
    status: sent
