    to: employee.user05@velmora.example
    subject: Data Classification Policy
    body: 'Data classification policy


      Data classification policy

      - is accessed only by people whose role requires it, and that access is logged;

      - is never pasted into unapproved tools, including AI assistants.


      ## Labeling

      Label documents in the header or the first line. When a document mixes levels, use the highest level that applies. If
      you are unsure, treat information as Confidential and ask the data owner.


      ## Data owners

      Every system and shared drive has a data owner, usually the leader of the team that created the data. Owners decide
      who may access their data and approve external sharing.


      ## Mistakes

      If you send or store information at the wrong level, for example by emailing a restricted spreadsheet to the wrong person,
      report it to the security team right away. Quick reporting limits harm, and good-faith mistakes are treated as learning
      opportunities.


      ## Related policies

      See the acceptable use policy, the shared drives guide, and the incident reporting page.'
