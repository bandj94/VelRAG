# Velmora Systems company facts (spec §5.2). AUTHORING AND SCORING ONLY.
# The app never reads this file (rule 3). Documents get facts only through
# {{fact:<key>}} placeholders, so documents agree with this file by construction.
#
# Each fact has:
#   value:    the canonical wording inserted into documents
#   patterns: regular expressions (matched case-insensitively, after NFKC
#             normalization) that recognize the fact in other wordings
#   tier:     general | hr | it_admin (which documents may carry it)
#
# Patterns are written in single-quoted YAML, so backslashes are literal.

facts:
  # --- Helpdesk -------------------------------------------------------------
  helpdesk.hours:
    tier: general
    value: "7:00 a.m. to 7:00 p.m. Eastern Time, Monday through Friday"
    patterns:
      - '\b7(:00)?\s*(a\.?\s?m\.?)?\s*(to|-|–|—|until|through|and)\s*7(:00)?\s*p\.?\s?m'
  helpdesk.phone:
    tier: general
    value: "extension 4357"
    patterns: ['\b4357\b']
  helpdesk.email:
    tier: general
    value: "helpdesk@velmora.example"
    patterns: ['helpdesk@velmora\.example']
  helpdesk.portal_url:
    tier: general
    value: "https://help.velmora.example"
    patterns: ['help\.velmora\.example']
  helpdesk.urgent_response:
    tier: general
    value: "30 minutes"
    patterns: ['\b(30|thirty)\s*(-\s*)?min']
  helpdesk.standard_response:
    tier: general
    value: "4 business hours"
    patterns: ['\b(4|four)\s*(business|working)\s*hours?']
  helpdesk.oncall_phone:
    tier: general
    value: "extension 4911"
    patterns: ['\b4911\b']

  # --- Passwords --------------------------------------------------------------
  password.min_length:
    tier: general
    value: "14 characters"
    patterns: ['\b(14|fourteen)\s*(-\s*)?(characters?|chars?)\b']
  password.history:
    tier: general
    value: "12"
    patterns:
      - '\b(12|twelve)\b[^.\n]{0,40}passwords?'
      - 'passwords?[^.\n]{0,40}\b(12|twelve)\b'
  password.reset_url:
    tier: general
    value: "https://reset.velmora.example"
    patterns: ['reset\.velmora\.example']
  password.reset_link_validity:
    tier: general
    value: "15 minutes"
    patterns: ['\b(15|fifteen)\s*(-\s*)?min']

  # --- MFA ------------------------------------------------------------------
  mfa.app:
    tier: general
    value: "VelKey"
    patterns: ['\bvel\s?key\b']
  mfa.enrollment_deadline:
    tier: general
    value: "7 days"
    patterns: ['\b(7|seven)\s*(calendar\s*)?days?\b', '\b(1|one)\s*week\b']
  mfa.backup_codes:
    tier: general
    value: "10"
    patterns: ['\b(10|ten)\b[^.\n]{0,30}backup\s*codes?', 'backup\s*codes?[^.\n]{0,30}\b(10|ten)\b']
  mfa.hardware_key_roles:
    tier: general
    value: "IT administrators and finance staff"
    patterns:
      - 'it\s*admin[^.\n]{0,80}finance'
      - 'finance[^.\n]{0,80}it\s*admin'

  # --- VPN ------------------------------------------------------------------
  vpn.client:
    tier: general
    value: "VelConnect"
    patterns: ['\bvel\s?connect\b']
  vpn.gateway:
    tier: general
    value: "vpn.velmora.example"
    patterns: ['vpn\.velmora\.example']
  vpn.idle_timeout:
    tier: general
    value: "45 minutes"
    patterns: ['\b(45|forty[-\s]?five)\s*(-\s*)?min']
  vpn.max_session:
    tier: general
    value: "12 hours"
    patterns: ['\b(12|twelve)\s*(-\s*)?hours?\b']

  # --- Wi-Fi ----------------------------------------------------------------
  wifi.corp_ssid:
    tier: general
    value: "VEL-Corp"
    patterns: ['\bvel[-\s]?corp\b']
  wifi.guest_ssid:
    tier: general
    value: "VEL-Guest"
    patterns: ['\bvel[-\s]?guest\b']
  wifi.guest_pass_validity:
    tier: general
    value: "24 hours"
    patterns: ['\b(24|twenty[-\s]?four)\s*(-\s*)?hours?\b', '\b(1|one)\s*(full\s*)?day\b']
  wifi.guest_pass_source:
    tier: general
    value: "the reception desk"
    patterns: ['\breception\b']

  # --- Laptops --------------------------------------------------------------
  laptop.refresh_cycle:
    tier: general
    value: "4 years"
    patterns: ['\b(4|four)\s*(-\s*)?years?\b']
  laptop.request_window:
    tier: general
    value: "60 days"
    patterns: ['\b(60|sixty)\s*(-\s*)?days?\b']
  laptop.standard_memory:
