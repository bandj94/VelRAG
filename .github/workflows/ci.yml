name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANONYMIZED_TELEMETRY: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"

      # Locked install; on Linux, torch comes from PyTorch's CPU index (spec §4).
      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Install Playwright Chromium (browser tests)
        run: uv run playwright install --with-deps chromium

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      # Mocked LLM and mocked classifier; no Ollama, GPU, or model downloads.
      # Tests that need downloaded model files skip themselves.
      - name: Pytest
        run: uv run pytest -q
