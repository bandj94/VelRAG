[project]
name = "ragsec"
version = "0.1.0"
description = "RAG Attack & Defense Lab: a deliberately vulnerable helpdesk assistant, seven defenses, and a measurement harness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "chromadb>=0.5",
    "torch>=2.3",
    "transformers>=4.44",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "python-dotenv>=1.0",
    "playwright>=1.45",
]

[project.scripts]
ragsec = "ragsec.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsec"]

# --- uv -------------------------------------------------------------------
# PyPI ships CPU-only torch wheels for Windows and macOS but CUDA wheels for
# Linux, so Linux (including CI) takes torch from PyTorch's CPU index (spec §4).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
# Keep uv's download cache inside the project folder (gitignored) so nothing
# lands in %LOCALAPPDATA%. See DECISIONS.md.
cache-dir = ".uv-cache"

# --- tools ----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Keep pytest's temporary files inside the project folder (gitignored).
addopts = "-ra --basetemp=.pytest_tmp"
markers = [
    "local_models: needs downloaded model files; skipped when they are absent (always skipped in CI)",
    "browser: needs Playwright Chromium",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".cache", ".chroma", "scratch", "train/.venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
no_implicit_optional = true
files = ["src"]
exclude = ["train/"]
