# Separate environment for the training-data poisoning extension (Run 6, spec §8.10).
# CUDA PyTorch for the RTX 3070 Ti; never shares an environment with the app.
# Set up only in Run 6: `uv sync --project train` (downloads ~5 GB).
[project]
name = "ragsec-train"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.11",
    "accelerate>=0.30",
    "datasets>=2.19",
    "safetensors>=0.4",
    "bitsandbytes>=0.43; sys_platform == 'linux' or sys_platform == 'win32'",
    "numpy>=1.26",
]

[tool.uv]
package = false
cache-dir = "../.uv-cache"

# CUDA wheels on Windows and Linux. Record the index actually used in DECISIONS.md
# (use the newest CUDA index PyTorch lists for Windows when Run 6 starts).
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
